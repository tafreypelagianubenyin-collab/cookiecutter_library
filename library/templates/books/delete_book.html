{% extends "base.html" %}

{% block title %}Delete Book{% endblock title %}

{% block content %}

<div class="min-h-screen bg-gray-100 py-12 px-6">

    <div class="max-w-xl mx-auto">

        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">

            <h1 class="text-3xl font-bold text-gray-800 mb-4">
                Delete Book
            </h1>

            <p class="text-gray-600 mb-8">
                Are you sure you want to delete
                <strong>"{{ book.title }}"</strong>?
            </p>

            <form method="post" class="flex justify-center gap-4">

                {% csrf_token %}

                <button
                    type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-lg transition"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'books:book_detail' book.pk %}"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-6 py-3 rounded-lg transition"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock content %}
